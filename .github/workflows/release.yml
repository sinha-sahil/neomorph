name: Release and Deploy

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
    types: [closed]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      sdk-changed: ${{ steps.changes.outputs.sdk }}
      weaver-changed: ${{ steps.changes.outputs.weaver }}
      studio-changed: ${{ steps.changes.outputs.studio }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect package changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            sdk:
              - 'packages/sdk/**'
            weaver:
              - 'packages/weaver/**'
            studio:
              - 'packages/studio/**'

  release:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.sdk-changed == 'true' ||
      needs.detect-changes.outputs.weaver-changed == 'true' ||
      needs.detect-changes.outputs.studio-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    environment: publish-env

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine version bump
        id: commit-info
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

          if [[ "$COMMIT_MSG" =~ ^feat(\(.+\))?!: ]] || [[ "$COMMIT_MSG" =~ BREAKING[[:space:]]CHANGE ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" =~ ^feat(\(.+\))?: ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
          fi

      - name: Publish SDK to npm
        if: needs.detect-changes.outputs.sdk-changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/sdk

          # npm version (not pnpm version): pnpm aborts on a dirty working tree.
          npm version ${{ steps.commit-info.outputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "SDK_NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "SDK -> $NEW_VERSION"

          pnpm build
          pnpm build:cdn

          if pnpm view @neomorph/sdk@$NEW_VERSION version 2>/dev/null; then
            echo "SDK $NEW_VERSION already on npm, skipping publish"
            echo "SDK_PUBLISHED=false" >> $GITHUB_ENV
          else
            pnpm publish --access public --registry https://registry.npmjs.org --no-git-checks
            echo "SDK_PUBLISHED=true" >> $GITHUB_ENV
          fi

      - name: Build and version Weaver
        if: needs.detect-changes.outputs.weaver-changed == 'true'
        run: |
          cd packages/weaver

          npm version ${{ steps.commit-info.outputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "WEAVER_NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "WEAVER_BUILT=true" >> $GITHUB_ENV
          echo "Weaver -> $NEW_VERSION"

          pnpm build

      - name: Deploy Studio to Vercel
        if: needs.detect-changes.outputs.studio-changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm build:studio
          cd packages/studio
          pnpm dlx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
          echo "STUDIO_DEPLOYED=true" >> $GITHUB_ENV

      - name: Commit version bumps and tag
        run: |
          TAGS=""

          if [[ "${{ env.SDK_PUBLISHED }}" == "true" ]]; then
            git add packages/sdk/package.json build/sdk
            TAGS="$TAGS sdk/${{ env.SDK_NEW_VERSION }}"
          elif [[ "${{ needs.detect-changes.outputs.sdk-changed }}" == "true" ]]; then
            git add build/sdk
          fi

          if [[ "${{ env.WEAVER_BUILT }}" == "true" ]]; then
            git add packages/weaver/package.json build/weaver
            TAGS="$TAGS weaver/${{ env.WEAVER_NEW_VERSION }}"
          fi

          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: bump package versions" -m "${{ steps.commit-info.outputs.message }}"
            git push origin release
          fi

          for tag in $TAGS; do
            git tag "$tag"
          done
          if [[ -n "$TAGS" ]]; then
            git push origin --tags
          fi
